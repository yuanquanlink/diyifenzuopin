<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Glass</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect fill='%23070b0a' width='16' height='16'/%3E%3C/svg%3E">
  <style>
    html, body { margin: 0; height: 100%; background: #070b0a; overflow: hidden; }
    #canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      background: #070b0a;
      image-rendering: pixelated;
      touch-action: none;
    }
    .modal { display: none; position: fixed; z-index: 2; inset: 0; background: rgba(0, 0, 0, .45); }
    .modal-content {
      color: #24180f;
      background: #f4efe4;
      margin: 12vh auto;
      padding: 12px 16px 18px;
      width: min(420px, calc(100% - 32px));
      font: 15px/1.4 ui-monospace, monospace;
    }
    .close { float: right; cursor: pointer; font-size: 22px; }
  </style>
</head>
<body>
  <canvas id="canvas" tabindex="0" oncontextmenu="event.preventDefault()"></canvas>
  <div id="add-modal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <p>Select a file to add to the computer</p>
      <p><input type="file" id="upload-input"></p>
    </div>
  </div>
  <script src="export-hook.js"></script>
  <script src="host.js"></script>
</body>
</html>
